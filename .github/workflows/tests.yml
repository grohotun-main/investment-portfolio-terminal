name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      # Pinned by commit SHA (not floating tag) so a re-pointed v4/v5 tag
      # in the upstream actions repo can't silently swap CI step code.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: install dependencies
        run: pip install -r requirements.txt

      - name: prepare config_local.py
        # config_local.py is gitignored (it is where a user's own account
        # config lives). The committed config_example.py has the same schema
        # with placeholders — exactly what the unit tests expect.
        run: cp config_example.py config_local.py

      - name: run unittest discover
        run: python -m unittest discover tests
